<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Akkordia</title>
  <link rel="stylesheet" href="./css/app.css">
  <script src="./vendor/msal-browser.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">Akkordia</div>
    <div class="header-actions">
      <button id="workspaceButton" class="workspace-button" type="button">Ingen band valgt</button>
      <button id="accountButton" class="account-button" type="button">Logg inn</button>
    </div>
  </header>

  <nav class="main-nav" aria-label="Hovednavigasjon">
    <button type="button" data-view="songs" class="is-active">Sanger</button>
    <button type="button" data-view="setlists">Set-lister</button>
    <button type="button" data-view="play">Spill</button>
  </nav>

  <main id="app" class="app-main">
    <section id="welcome" class="panel empty-state">
      <h1>Velkommen til Akkordia</h1>
      <p>Koble til et eksisterende band i OneDrive for å komme i gang.</p>
      <div class="actions">
        <button id="connectWorkspace" type="button">Koble til band</button>
        <button id="createWorkspace" type="button" class="secondary" disabled>Opprett nytt band</button>
      </div>
      <p class="notice">Oppretting av nye band kommer i et senere trinn.</p>
    </section>

    <section id="workspaceStatus" class="panel status-panel hidden" aria-live="polite"></section>

    <section id="songsView" class="songs-layout hidden">
      <aside class="song-library" aria-label="Sangbibliotek">
        <div class="library-header">
          <div class="library-title-row">
            <h1>Sanger</h1>
            <button id="newSongButton" type="button" class="secondary small">+ Ny sang</button>
          </div>
          <label class="lyrics-view-control">
            <span>Vis</span>
            <select id="lyricsView">
              <option value="both">Vokal + koring</option>
              <option value="vocal">Vokal</option>
              <option value="harmony">Koring</option>
            </select>
          </label>
        </div>
        <div id="songListMessage" class="message hidden" aria-live="polite"></div>
        <div id="songList" class="song-list"></div>
      </aside>

      <article id="songDetail" class="song-detail">
        <div class="song-placeholder">
          <p>Velg en sang fra biblioteket.</p>
        </div>
      </article>
    </section>
  </main>

  <dialog id="folderDialog" class="folder-dialog">
    <form method="dialog" class="folder-dialog-inner">
      <header class="dialog-header">
        <div>
          <h2>Velg Akkordia-mappe</h2>
          <p id="folderPath" class="muted">OneDrive</p>
        </div>
        <button value="cancel" class="icon-button" aria-label="Lukk">×</button>
      </header>

      <div class="folder-toolbar">
        <button id="folderUp" type="button" class="secondary">Opp ett nivå</button>
        <button id="selectFolder" type="button">Bruk denne mappen</button>
      </div>

      <div id="folderMessage" class="message hidden" aria-live="polite"></div>
      <div id="folderList" class="folder-list"></div>
    </form>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
