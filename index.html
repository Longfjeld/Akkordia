<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Akkordia</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Akkordia</div>
    <button id="workspaceButton" class="workspace-button" type="button" aria-haspopup="true">
      Ingen band valgt
    </button>
  </header>

  <nav class="main-nav" aria-label="Hovednavigasjon">
    <button type="button" data-view="songs" class="is-active">Sanger</button>
    <button type="button" data-view="setlists">Set-lister</button>
    <button type="button" data-view="play">Spill</button>
  </nav>

  <main id="app" class="app-main">
    <section class="empty-state">
      <h1>Velkommen til Akkordia</h1>
      <p>Koble til et eksisterende band eller opprett et nytt band for å komme i gang.</p>
      <div class="actions">
        <button id="connectWorkspace" type="button">Koble til band</button>
        <button id="createWorkspace" type="button" class="secondary">Opprett nytt band</button>
      </div>
      <p id="phaseNotice" class="notice">
        OneDrive-tilkobling implementeres i neste trinn.
      </p>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
